<script>
/*
 * Lógica de negocio de Founder Match, en el navegador.
 *
 *  - buildFounderCard: arma la Founder Card de forma determinística con las
 *    respuestas del formulario. No hay ningún modelo de lenguaje de por medio.
 *  - generateTeams: algoritmo de afinidad. Corazones mutuos suman +3, se siembran
 *    los equipos con round-robin por industria y el resto entra con un greedy
 *    global por afinidad promedio. Equipos de 3 a 4 personas.
 */
window.FMLogic = (function () {
  /* ------------------------------ Founder Card ------------------------------ */

  function firstSentence(value, max) {
    var head = (value || '').trim().split('.')[0];
    head = head ? head.trim() : '';
    return head ? head.slice(0, max) : '';
  }

  function firstItem(value) {
    var head = (value || '').trim().split(',')[0];
    return head ? head.trim() : '';
  }

  function splitList(value) {
    if (!value) return [];
    return value
      .split(/[,;]/)
      .map(function (s) { return s.trim(); })
      .filter(Boolean);
  }

  function detectArchetype(p) {
    var text = [p.role, p.technicalSkills, p.softSkills, p.purpose].join(' ').toLowerCase();
    if (text.indexOf('dato') >= 0 || text.indexOf('analítica') >= 0 || text.indexOf('analitica') >= 0 || text.indexOf('data') >= 0)
      return '📊 El Analista';
    if (text.indexOf('diseño') >= 0 || text.indexOf('diseno') >= 0 || text.indexOf('ux') >= 0 || text.indexOf('creativ') >= 0)
      return '🎨 El Creativo';
    if (text.indexOf('ventas') >= 0 || text.indexOf('comercial') >= 0 || text.indexOf('negocio') >= 0)
      return '💼 El Comercial';
    if (text.indexOf('tecnolog') >= 0 || text.indexOf('desarrollo') >= 0 || text.indexOf('código') >= 0 || text.indexOf('codigo') >= 0)
      return '⚙️ El Técnico';
    if (text.indexOf('líder') >= 0 || text.indexOf('lider') >= 0 || text.indexOf('gestión') >= 0 || text.indexOf('gestion') >= 0 || text.indexOf('estrategia') >= 0)
      return '🧭 El Estratega';
    return '🚀 El Founder';
  }

  function buildFounderCard(p) {
    var tagline = firstSentence(p.purpose, 80) || p.role || 'Founder en construcción';
    var superpower = firstSentence(p.whereAddsValue, 60) || firstItem(p.technicalSkills) || 'Aprender rápido';
    var missionStatement =
      ((p.purpose || '').trim() || 'Crear impacto') + ' en el sector ' + (p.industry || 'que elija');
    var lookingFor = firstSentence(p.whereNeedsHelp, 80) || 'Un equipo complementario';

    var topStrengths = [firstItem(p.technicalSkills), firstItem(p.softSkills), firstItem(p.whereAddsValue)]
      .filter(Boolean)
      .slice(0, 3);

    return {
      tagline: tagline,
      superpower: superpower,
      missionStatement: missionStatement,
      lookingFor: lookingFor,
      topStrengths: topStrengths,
      topPassions: splitList(p.passions).slice(0, 3),
      problemFocus: firstSentence(p.problemsToSolve, 100),
      funFact: firstItem(p.hobbies) || (p.personality || '').trim(),
      archetype: detectArchetype(p),
      industry: p.industry || '',
    };
  }

  /* -------------------------------- Equipos -------------------------------- */

  var MUTUAL_HEART_BONUS = 3;
  var HEART_POINTS = 1;
  var DOUBT_POINTS = -1.5;

  var STOPWORDS = {};
  ('para con como este esta esto esos esas mas muy pero porque cuando donde todo toda todos todas que los las ' +
   'del una uno unos unas por sus sin ser soy mis tener hacer poder sobre entre desde hasta the and for with ' +
   'gente cosas tema temas area areas mucho mucha bien solo otro otra')
    .split(' ')
    .forEach(function (w) { STOPWORDS[w] = true; });

  function norm(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim();
  }

  /** Normaliza para comparar pero guarda la palabra original, con tildes, para mostrarla. */
  function tokenize(value, display) {
    var out = {};
    if (!value) return out;
    String(value).split(/[^\p{L}\p{N}]+/u).forEach(function (word) {
      if (!word) return;
      var token = norm(word);
      if (token.length < 4 || STOPWORDS[token]) return;
      out[token] = true;
      if (display && !display[token]) display[token] = word.toLowerCase();
    });
    return out;
  }

  function sharedTokens(a, b) {
    return Object.keys(a).filter(function (t) { return b[t]; });
  }

  function capped(count, perHit, max) {
    return Math.min(count * perHit, max);
  }

  function enrich(student, display) {
    var p = student.profile || {};
    return {
      student: student,
      archetype: (student.card && student.card.archetype) || detectArchetype(p),
      industry: norm(student.industry || 'sin industria'),
      passions: tokenize(p.passions, display),
      values: tokenize(p.values, display),
      problems: tokenize(p.problemsToSolve, display),
      workStyle: tokenize(p.workStyle, display),
      addsValue: tokenize(p.whereAddsValue, display),
      needsHelp: tokenize(p.whereNeedsHelp, display),
    };
  }

  function indexVotes(votes) {
    var index = {};
    votes.forEach(function (v) {
      var entry = index[v.voter_id] || (index[v.voter_id] = { hearts: {}, doubts: {} });
      if (v.vote_type === 'heart') entry.hearts[v.target_id] = true;
      else entry.doubts[v.target_id] = true;
    });
    return index;
  }

  function pairScore(a, b, votes) {
    var av = votes[a.student.id] || { hearts: {}, doubts: {} };
    var bv = votes[b.student.id] || { hearts: {}, doubts: {} };
    var aHeartsB = !!av.hearts[b.student.id];
    var bHeartsA = !!bv.hearts[a.student.id];

    var score = 0;
    if (aHeartsB) score += HEART_POINTS;
    if (bHeartsA) score += HEART_POINTS;
    if (aHeartsB && bHeartsA) score += MUTUAL_HEART_BONUS;
    if (av.doubts[b.student.id]) score += DOUBT_POINTS;
    if (bv.doubts[a.student.id]) score += DOUBT_POINTS;

    if (a.archetype !== b.archetype) score += 2;
    if (a.industry !== b.industry) score += 0.5;

    score += capped(sharedTokens(a.needsHelp, b.addsValue).length, 1.5, 3);
    score += capped(sharedTokens(b.needsHelp, a.addsValue).length, 1.5, 3);
    score += capped(sharedTokens(a.passions, b.passions).length, 1, 2);
    score += capped(sharedTokens(a.values, b.values).length, 0.75, 1.5);
    score += capped(sharedTokens(a.problems, b.problems).length, 1, 2);
    score += capped(sharedTokens(a.workStyle, b.workStyle).length, 0.5, 1);
    return score;
  }

  function teamCountFor(n) {
    var count = Math.ceil(n / 4);
    while (count > 1 && n < count * 3) count--;
    return Math.max(1, count);
  }

  function generateTeams(students, votes) {
    if (!students.length) return [];

    var display = {};
    var people = students
      .slice()
      .sort(function (a, b) { return a.ts - b.ts; })
      .map(function (s) { return enrich(s, display); });
    var voteIndex = indexVotes(votes || []);

    if (people.length <= 4) return [describeTeam(1, people, voteIndex, display)];

    var count = teamCountFor(people.length);
    var base = Math.floor(people.length / count);
    var remainder = people.length % count;
    var capacity = [];
    for (var i = 0; i < count; i++) capacity.push(base + (i < remainder ? 1 : 0));

    // Round-robin por industria: se reparte una persona de cada industria por turno.
    var buckets = {};
    people.forEach(function (person) {
      (buckets[person.industry] || (buckets[person.industry] = [])).push(person);
    });
    var queues = Object.keys(buckets)
      .map(function (k) { return buckets[k]; })
      .sort(function (a, b) { return b.length - a.length; });

    var ordered = [];
    var pending = people.length;
    while (pending > 0) {
      queues.forEach(function (queue) {
        var next = queue.shift();
        if (next) {
          ordered.push(next);
          pending--;
        }
      });
    }

    var teams = [];
    for (var t = 0; t < count; t++) teams.push(ordered[t] ? [ordered[t]] : []);
    var remaining = ordered.slice(count);

    // Greedy global: entra siempre la mejor pareja (persona, equipo) disponible.
    while (remaining.length > 0) {
      var bestPerson = 0;
      var bestTeam = -1;
      var bestScore = -Infinity;
      for (var pi = 0; pi < remaining.length; pi++) {
        for (var ti = 0; ti < teams.length; ti++) {
          if (teams[ti].length >= capacity[ti]) continue;
          var sum = 0;
          for (var m = 0; m < teams[ti].length; m++) sum += pairScore(remaining[pi], teams[ti][m], voteIndex);
          var sameIndustry = teams[ti].filter(function (x) { return x.industry === remaining[pi].industry; }).length;
          var score = sum / teams[ti].length - sameIndustry * 1.5;
          if (score > bestScore) {
            bestScore = score;
            bestPerson = pi;
            bestTeam = ti;
          }
        }
      }
      if (bestTeam === -1) break;
      teams[bestTeam].push(remaining[bestPerson]);
      remaining.splice(bestPerson, 1);
    }

    return teams
      .filter(function (t) { return t.length > 0; })
      .map(function (members, i) { return describeTeam(i + 1, members, voteIndex, display); });
  }

  function unique(list) {
    var seen = {};
    return list.filter(function (x) {
      if (!x || seen[x]) return false;
      seen[x] = true;
      return true;
    });
  }

  function topRepeated(tokens, limit, display) {
    var counts = {};
    tokens.forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
    return Object.keys(counts)
      .sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); })
      .slice(0, limit)
      .map(function (t) { return display[t] || t; });
  }

  function capitalize(value) {
    return value.charAt(0).toUpperCase() + value.slice(1);
  }

  function describeTeam(id, members, votes, display) {
    var names = members.map(function (m) { return m.student.name; });
    var industries = unique(members.map(function (m) { return m.student.industry; }));
    var archetypes = unique(members.map(function (m) { return m.archetype; }));

    var mutualHearts = 0;
    var passionHits = [];
    var valueHits = [];
    var problemHits = [];
    var bridges = [];

    for (var i = 0; i < members.length; i++) {
      for (var j = i + 1; j < members.length; j++) {
        var a = members[i];
        var b = members[j];
        var av = votes[a.student.id] || { hearts: {} };
        var bv = votes[b.student.id] || { hearts: {} };
        if (av.hearts[b.student.id] && bv.hearts[a.student.id]) mutualHearts++;
        passionHits = passionHits.concat(sharedTokens(a.passions, b.passions));
        valueHits = valueHits.concat(sharedTokens(a.values, b.values));
        problemHits = problemHits.concat(sharedTokens(a.problems, b.problems));
        if (sharedTokens(a.needsHelp, b.addsValue).length > 0)
          bridges.push(b.student.name + ' cubre lo que ' + a.student.name + ' pidió reforzar');
        if (sharedTokens(b.needsHelp, a.addsValue).length > 0)
          bridges.push(a.student.name + ' cubre lo que ' + b.student.name + ' pidió reforzar');
      }
    }

    var reasonParts = [];
    if (mutualHearts > 0) {
      reasonParts.push(
        mutualHearts === 1
          ? 'tiene 1 conexión mutua de corazón en la votación'
          : 'tiene ' + mutualHearts + ' conexiones mutuas de corazón en la votación'
      );
    }
    if (industries.length > 1) reasonParts.push('combina ' + industries.length + ' industrias (' + industries.join(', ') + ')');
    else if (industries.length === 1) reasonParts.push('comparte foco en ' + industries[0]);
    if (archetypes.length > 1) reasonParts.push('mezcla ' + archetypes.length + ' perfiles distintos');

    var reason = reasonParts.length
      ? capitalize(reasonParts.join('; ')) + '.'
      : 'Armado por balance de perfiles e industrias.';

    var topPassions = topRepeated(passionHits.concat(problemHits), 3, display);
    var topValues = topRepeated(valueHits, 2, display);
    var synergyParts = [];
    if (topPassions.length) synergyParts.push('intereses en común: ' + topPassions.join(', '));
    if (topValues.length) synergyParts.push('valores compartidos: ' + topValues.join(', '));
    var synergy = synergyParts.length
      ? capitalize(synergyParts.join(' · '))
      : names.join(', ') + ' no declararon intereses idénticos, así que el equipo arranca desde la curiosidad mutua.';

    var complementarityParts = ['Perfiles: ' + archetypes.join(' + ')];
    var uniqueBridges = unique(bridges).slice(0, 3);
    if (uniqueBridges.length) complementarityParts.push(uniqueBridges.join('; '));

    return {
      id: id,
      members: members.map(function (m) { return m.student.id; }),
      reason: reason,
      synergy: synergy,
      complementarity: complementarityParts.join('. ') + '.',
    };
  }

  return {
    buildFounderCard: buildFounderCard,
    detectArchetype: detectArchetype,
    generateTeams: generateTeams,
  };
})();

</script>
<script>
/*
 * Capa de datos y utilidades de Founder Match.
 *
 * Los datos viven en Supabase: los celulares hablan directo con la base, sin
 * pasar por n8n (n8n solo entrega las paginas). El cambio de card llega por el
 * canal en vivo de Supabase, por eso los 18 celulares cambian al mismo tiempo.
 */
window.FM = (function () {
  var STUDENT_KEY = 'fm_student_id';
  var NAME_KEY = 'fm_student_name';
  var VOTED_KEY = 'fm_voted_ids';
  var PIN_KEY = 'fm_pin';

  var db = window.supabase.createClient(FM_CONFIG.supabaseUrl, FM_CONFIG.supabaseAnonKey, {
    auth: { persistSession: false },
    realtime: { params: { eventsPerSecond: 20 } },
  });

  var photoCache = {};

  /* ------------------------------- Utilidades ------------------------------- */

  function esc(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function initials(name) {
    var parts = String(name || '?').trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function toast(message, kind) {
    var host = document.querySelector('.fm-toast');
    if (!host) {
      host = document.createElement('div');
      host.className = 'fm-toast';
      document.body.appendChild(host);
    }
    var node = document.createElement('div');
    node.className = kind === 'error' ? 'toast-error' : kind === 'ok' ? 'toast-ok' : '';
    node.textContent = message;
    host.appendChild(node);
    setTimeout(function () {
      node.style.transition = 'opacity .3s ease';
      node.style.opacity = '0';
      setTimeout(function () { node.remove(); }, 320);
    }, 3200);
  }

  function newStudentId() {
    var rand = function () { return Math.random().toString(36).slice(2, 8); };
    return 's_' + Date.now() + '_' + rand() + '_' + rand();
  }

  /* --------------------------- Estado del navegador -------------------------- */

  function studentId() { return localStorage.getItem(STUDENT_KEY); }
  function studentName() { return localStorage.getItem(NAME_KEY) || ''; }

  function setStudent(id, name) {
    localStorage.setItem(STUDENT_KEY, id);
    if (name) localStorage.setItem(NAME_KEY, name);
  }

  function forgetStudent() {
    localStorage.removeItem(STUDENT_KEY);
    localStorage.removeItem(NAME_KEY);
    localStorage.removeItem(VOTED_KEY);
  }

  /** Si ya voto por esa persona. Se pregunta a la base, no al navegador:
   *  asi el estudiante puede cambiar de celular sin perder su historial. */
  async function hasVoted(targetId) {
    var voter = studentId();
    if (!voter) return false;
    var rows = unwrap(
      await db.from('fm_votes').select('id').eq('voter_id', voter).eq('target_id', targetId)
    );
    return rows.length > 0;
  }

  /* --------------------------------- Lectura -------------------------------- */

  function unwrap(res) {
    if (res.error) throw new Error(res.error.message || 'Error de base de datos');
    return res.data;
  }

  async function students() {
    return unwrap(
      await db.from('fm_students').select('id,ts,name,role,industry,has_photo,card').order('ts', { ascending: true })
    );
  }

  async function studentsFull() {
    return unwrap(await db.from('fm_students').select('*').order('ts', { ascending: true }));
  }

  async function student(id) {
    var rows = unwrap(await db.from('fm_students').select('id,ts,name,role,industry,has_photo,card').eq('id', id));
    return rows[0] || null;
  }

  async function votes() {
    return unwrap(await db.from('fm_votes').select('voter_id,target_id,vote_type'));
  }

  /** { targetId: {hearts, doubts, total, heartPct} } a partir de todos los votos. */
  function tallyFrom(voteRows) {
    var out = {};
    voteRows.forEach(function (v) {
      var t = out[v.target_id] || (out[v.target_id] = { hearts: 0, doubts: 0, total: 0, heartPct: 0 });
      if (v.vote_type === 'heart') t.hearts++;
      else t.doubts++;
    });
    Object.keys(out).forEach(function (id) {
      var t = out[id];
      t.total = t.hearts + t.doubts;
      t.heartPct = t.total === 0 ? 0 : Math.round((t.hearts / t.total) * 100);
    });
    return out;
  }

  function emptyTally() {
    return { hearts: 0, doubts: 0, total: 0, heartPct: 0 };
  }

  async function state() {
    var rows = unwrap(await db.from('fm_state').select('*').eq('id', 1));
    return rows[0] || { current_card_id: null, match_active: false, teams: null };
  }

  async function photo(id) {
    if (photoCache[id] !== undefined) return photoCache[id];
    var rows = unwrap(await db.from('fm_student_photos').select('photo').eq('student_id', id));
    photoCache[id] = rows[0] ? rows[0].photo : '';
    return photoCache[id];
  }

  /* -------------------------------- Escritura ------------------------------- */

  async function submit(profile, photoData) {
    var id = newStudentId();
    var card = FMLogic.buildFounderCard(profile);

    var res = await db.from('fm_students').insert({
      id: id,
      ts: Date.now(),
      name: profile.name,
      role: profile.role || '',
      industry: profile.industry || '',
      has_photo: Boolean(photoData),
      profile: profile,
      card: card,
    });
    if (res.error) throw new Error(res.error.message);

    if (photoData) {
      var photoRes = await db.from('fm_student_photos').insert({ student_id: id, photo: photoData });
      if (photoRes.error) {
        // La card ya quedo creada; la foto es secundaria.
        console.warn('No se pudo guardar la foto:', photoRes.error.message);
      } else {
        photoCache[id] = photoData;
      }
    }
    return { id: id, card: card };
  }

  async function vote(targetId, type) {
    var voter = studentId();
    if (!voter) throw new Error('Primero crea tu perfil');
    if (voter === targetId) throw new Error('No puedes votarte a ti mismo');

    var res = await db.from('fm_votes').insert({
      voter_id: voter,
      target_id: targetId,
      vote_type: type,
      ts: Date.now(),
    });
    if (res.error) {
      if (res.error.code === '23505') {
        var err = new Error('Ya votaste por esta persona');
        err.already = true;
        throw err;
      }
      throw new Error(res.error.message);
    }
  }

  /* --------------------------- Acciones del docente -------------------------- */

  function pin() { return localStorage.getItem(PIN_KEY) || ''; }

  async function pinIsValid(value) {
    var res = await db.rpc('fm_pin_ok', { p_pin: value });
    return !res.error && res.data === true;
  }

  /**
   * Si el link trae ?clave=..., la guarda y la borra de la barra de direcciones.
   * Asi el docente abre su link una vez y no vuelve a escribir nada.
   */
  async function adoptPinFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var value = (params.get('clave') || params.get('pin') || '').trim();
    if (!value) return;
    params.delete('clave');
    params.delete('pin');
    var limpio = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    history.replaceState(null, '', limpio);
    if (await pinIsValid(value)) localStorage.setItem(PIN_KEY, value);
  }

  /** Ventana propia, no el prompt del navegador: explica qué es la clave. */
  function askPin() {
    return new Promise(function (resolve) {
      var fondo = document.createElement('div');
      fondo.className = 'fixed inset-0 z-[60] flex items-center justify-center bg-black/75 px-4';
      fondo.innerHTML =
        '<div class="glass-strong rounded-2xl p-6 max-w-sm w-full anim-pop">' +
        '<h3 class="text-lg font-bold">Clave del docente</h3>' +
        '<p class="text-white/70 text-sm mt-2 leading-relaxed">' +
        'Protege la proyección: sin ella, un estudiante podría cambiar la card que ves en pantalla. ' +
        'La tienes en la página de la clase en Notion.</p>' +
        '<input id="fmPinInput" type="password" class="field mt-4" placeholder="Escribe la clave" autocomplete="off">' +
        '<p id="fmPinError" class="text-red-300 text-sm mt-2" style="display:none">Esa clave no es. Intenta de nuevo.</p>' +
        '<div class="flex gap-2 mt-4">' +
        '<button id="fmPinCancel" class="btn btn-ghost flex-1">Ahora no</button>' +
        '<button id="fmPinOk" class="btn btn-primary flex-1">Entrar</button>' +
        '</div></div>';
      document.body.appendChild(fondo);

      var input = fondo.querySelector('#fmPinInput');
      var error = fondo.querySelector('#fmPinError');
      var listo = function (valor) {
        fondo.remove();
        resolve(valor);
      };

      var probar = async function () {
        var valor = input.value.trim();
        if (!valor) return;
        if (await pinIsValid(valor)) {
          localStorage.setItem(PIN_KEY, valor);
          listo(true);
        } else {
          error.style.display = '';
          input.value = '';
          input.focus();
        }
      };

      fondo.querySelector('#fmPinOk').addEventListener('click', probar);
      fondo.querySelector('#fmPinCancel').addEventListener('click', function () { listo(false); });
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') probar(); });
      input.focus();
    });
  }

  /** Pide la clave una sola vez por dispositivo. */
  async function ensurePin() {
    if (pin()) return true;
    return askPin();
  }

  async function setCard(id) {
    if (!(await ensurePin())) return false;
    var res = await db.rpc('fm_set_card', { p_pin: pin(), p_student_id: id || '' });
    if (res.error) throw new Error(res.error.message);
    return true;
  }

  async function saveTeams(teams) {
    if (!(await ensurePin())) return false;
    var res = await db.rpc('fm_save_teams', { p_pin: pin(), p_teams: teams });
    if (res.error) throw new Error(res.error.message);
    return true;
  }

  async function resetAll() {
    if (!(await ensurePin())) return false;
    var res = await db.rpc('fm_reset_all', { p_pin: pin() });
    if (res.error) throw new Error(res.error.message);
    photoCache = {};
    return true;
  }

  /** Genera los equipos con el algoritmo de afinidad y los guarda. */
  async function generateAndSaveTeams() {
    var people = await studentsFull();
    if (people.length < 3) throw new Error('Se necesitan al menos 3 estudiantes registrados');
    var teams = FMLogic.generateTeams(people, await votes());
    if (!(await saveTeams(teams))) return null;
    return teams;
  }

  /* -------------------------------- Tiempo real ------------------------------ */

  /**
   * handlers = { onStatus, student (nuevo registro), vote (voto nuevo), state (cambio de card o equipos) }
   * El handler `state` recibe { studentId, matchActive, teams, student }.
   */
  function live(handlers) {
    var channel = db
      .channel('founder-match')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'fm_students' }, function (payload) {
        if (handlers.student) handlers.student(payload.new);
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'fm_votes' }, function (payload) {
        if (handlers.vote) handlers.vote(payload.new);
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'fm_state' }, async function (payload) {
        if (!handlers.state) return;
        var row = payload.new;
        var current = row.current_card_id ? await student(row.current_card_id) : null;
        handlers.state({
          studentId: row.current_card_id,
          matchActive: row.match_active,
          teams: row.teams,
          student: current,
        });
      })
      .subscribe(function (status) {
        if (handlers.onStatus) handlers.onStatus(status === 'SUBSCRIBED');
      });
    return channel;
  }

  /* ---------------------------------- Vistas -------------------------------- */

  function avatarHtml(person, sizeClass, extraClass) {
    var cls = 'avatar ' + (sizeClass || 'w-12 h-12 text-base') + ' ' + (extraClass || '');
    var id = person && person.id;
    var hasPhoto = person && (person.has_photo || person.hasPhoto);
    return (
      '<div class="' + cls + '"' + (hasPhoto ? ' data-photo="' + esc(id) + '"' : '') + '>' +
      esc(initials(person && person.name)) +
      '</div>'
    );
  }

  /** Rellena las fotos de los avatares que quedaron pendientes en el DOM. */
  async function hydratePhotos(root) {
    var nodes = (root || document).querySelectorAll('[data-photo]');
    if (!nodes.length) return;
    var ids = [];
    Array.prototype.forEach.call(nodes, function (node) {
      var id = node.getAttribute('data-photo');
      if (photoCache[id] === undefined && ids.indexOf(id) === -1) ids.push(id);
    });

    if (ids.length) {
      var rows = unwrap(await db.from('fm_student_photos').select('student_id,photo').in('student_id', ids));
      rows.forEach(function (row) { photoCache[row.student_id] = row.photo; });
      ids.forEach(function (id) { if (photoCache[id] === undefined) photoCache[id] = ''; });
    }

    Array.prototype.forEach.call(nodes, function (node) {
      var url = photoCache[node.getAttribute('data-photo')];
      if (!url) return;
      node.textContent = '';
      node.style.backgroundImage = 'url(' + url + ')';
      node.style.backgroundSize = 'cover';
      node.style.backgroundPosition = 'center';
      node.removeAttribute('data-photo');
    });
  }

  function nav(active) {
    var links = [
      ['/', 'Docente'],
      ['/match', 'Pantalla'],
      ['/form', 'Formulario'],
      ['/vote', 'Votar'],
      ['/results', 'Equipos'],
      ['/slides', 'Slides'],
      ['/innovacion', 'Innovación'],
      ['/toolkit', 'Toolkit'],
      ['/hub', 'Hub'],
    ];
    return links
      .map(function (link) {
        var href = url(link[0]);
        var on = link[0] === active;
        return (
          '<a href="' + href + '" class="px-3 py-1.5 rounded-lg text-sm font-medium transition ' +
          (on ? 'bg-amarillo text-[#102F4E]' : 'text-white/65 hover:text-white hover:bg-white/10') +
          '">' + link[1] + '</a>'
        );
      })
      .join('');
  }

  /**
   * Resuelve un link interno. Sirve tanto servido por n8n
   * (.../webhook/founder-match/form) como en local (/form).
   */
  function url(path) {
    var clean = path === '/' ? 'dashboard' : path.replace(/^\//, '');
    // FM_STATIC lo inyecta scripts/build-pages.mjs en las paginas publicadas,
    // donde cada ruta es un archivo .html. En el servidor local son rutas limpias.
    if (window.FM_STATIC) {
      return window.location.pathname.replace(/[^/]*$/, '') + clean + '.html';
    }
    return path;
  }

  /** Redimensiona y comprime la foto en el navegador antes de subirla. */
  function compressImage(file, maxSide, quality) {
    maxSide = maxSide || 720;
    quality = quality || 0.72;
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('No se pudo leer la imagen')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('El archivo no parece una imagen')); };
        img.onload = function () {
          var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  adoptPinFromUrl();

  return {
    db: db,
    esc: esc,
    initials: initials,
    toast: toast,
    url: url,
    nav: nav,
    avatarHtml: avatarHtml,
    hydratePhotos: hydratePhotos,
    compressImage: compressImage,

    studentId: studentId,
    studentName: studentName,
    setStudent: setStudent,
    forgetStudent: forgetStudent,
    hasVoted: hasVoted,

    students: students,
    studentsFull: studentsFull,
    student: student,
    votes: votes,
    tallyFrom: tallyFrom,
    emptyTally: emptyTally,
    state: state,
    photo: photo,

    submit: submit,
    vote: vote,
    setCard: setCard,
    resetAll: resetAll,
    generateAndSaveTeams: generateAndSaveTeams,
    ensurePin: ensurePin,

    live: live,
  };
})();

</script>

<div class="min-h-screen flex flex-col">
  <div class="h-1 bg-white/10">
    <div id="progress" class="h-full bg-amarillo transition-all duration-300" style="width:0%"></div>
  </div>

  <main id="stage" class="flex-1 flex items-center justify-center px-5 py-8 md:px-14"></main>

  <footer class="flex items-center justify-between gap-3 px-5 pb-5 md:px-14">
    <button id="prev" class="btn btn-ghost">←</button>
    <div class="flex-1 flex items-center justify-center gap-1.5 flex-wrap" id="dots"></div>
    <div class="flex items-center gap-3">
      <span id="counter" class="text-white/50 text-sm tabular-nums font-semibold"></span>
      <button id="next" class="btn btn-primary">→</button>
    </div>
  </footer>
</div>

<script>
  var index = 0;
  var slides = window.SLIDES || [];

  function esc(v) { return FM.esc(v); }

  function bodyHtml(body) {
    if (!body || !body.length) return '';
    return (
      '<div class="space-y-3 mt-6 max-w-3xl">' +
      body
        .map(function (p) {
          return '<p class="text-lg md:text-2xl text-white/75 leading-relaxed">' + esc(p) + '</p>';
        })
        .join('') +
      '</div>'
    );
  }

  function eyebrowHtml(text) {
    if (!text) return '';
    return '<p class="chip mb-5">' + esc(text) + '</p>';
  }

  function footerHtml(text) {
    if (!text) return '';
    return '<p class="mt-8 text-amarillo/85 text-base md:text-lg font-semibold">' + esc(text) + '</p>';
  }

  function renderSlide(slide) {
    switch (slide.layout) {
      case 'cover':
        return (
          '<div class="text-center max-w-4xl anim-pop">' +
          eyebrowHtml(slide.eyebrow) +
          '<h1 class="text-5xl md:text-7xl font-black leading-[1.05]">' + esc(slide.title) + '</h1>' +
          (slide.subtitle ? '<p class="text-xl md:text-3xl text-white/70 mt-5">' + esc(slide.subtitle) + '</p>' : '') +
          '<div class="w-24 h-1.5 bg-amarillo rounded-full mx-auto mt-8"></div>' +
          footerHtml(slide.footer) +
          '</div>'
        );

      case 'quote':
        return (
          '<div class="max-w-4xl anim-pop">' +
          eyebrowHtml(slide.eyebrow) +
          '<p class="text-4xl md:text-6xl font-black leading-tight text-amarillo">“' + esc(slide.quote) + '”</p>' +
          bodyHtml(slide.body) +
          footerHtml(slide.footer) +
          '</div>'
        );

      case 'bullets':
        return (
          '<div class="max-w-4xl w-full anim-pop">' +
          eyebrowHtml(slide.eyebrow) +
          '<h2 class="text-4xl md:text-5xl font-black leading-tight">' + esc(slide.title) + '</h2>' +
          '<ul class="mt-7 space-y-4">' +
          (slide.bullets || [])
            .map(function (b) {
              return (
                '<li class="flex gap-4 items-start">' +
                '<span class="mt-2 w-2.5 h-2.5 rounded-full bg-amarillo shrink-0"></span>' +
                '<span class="text-lg md:text-2xl text-white/80 leading-snug">' + esc(b) + '</span></li>'
              );
            })
            .join('') +
          '</ul>' +
          footerHtml(slide.footer) +
          '</div>'
        );

      case 'cards':
        return (
          '<div class="max-w-6xl w-full anim-pop">' +
          eyebrowHtml(slide.eyebrow) +
          '<h2 class="text-4xl md:text-5xl font-black mb-7">' + esc(slide.title) + '</h2>' +
          '<div class="grid md:grid-cols-' + Math.min((slide.cards || []).length, 4) + ' gap-4">' +
          (slide.cards || [])
            .map(function (c, i) {
              return (
                '<div class="glass rounded-2xl p-6 anim-fade" style="animation-delay:' + i * 90 + 'ms">' +
                '<div class="text-4xl mb-3">' + esc(c.icon || '•') + '</div>' +
                '<h3 class="font-bold text-xl text-amarillo">' + esc(c.title) + '</h3>' +
                '<p class="text-white/75 mt-2 leading-snug">' + esc(c.text) + '</p></div>'
              );
            })
            .join('') +
          '</div>' +
          footerHtml(slide.footer) +
          '</div>'
        );

      case 'steps':
        return (
          '<div class="max-w-6xl w-full anim-pop">' +
          eyebrowHtml(slide.eyebrow) +
          '<h2 class="text-4xl md:text-5xl font-black mb-8">' + esc(slide.title) + '</h2>' +
          '<div class="grid md:grid-cols-5 gap-3">' +
          (slide.steps || [])
            .map(function (s, i) {
              return (
                '<div class="glass rounded-2xl p-5 anim-fade" style="animation-delay:' + i * 80 + 'ms">' +
                '<div class="w-10 h-10 rounded-xl bg-amarillo text-azul grid place-items-center font-black mb-3">' + esc(s.n) + '</div>' +
                '<h3 class="font-bold text-lg">' + esc(s.title) + '</h3>' +
                '<p class="text-white/65 text-sm mt-1.5 leading-snug">' + esc(s.text) + '</p></div>'
              );
            })
            .join('') +
          '</div>' +
          footerHtml(slide.footer) +
          '</div>'
        );

      case 'table':
        return (
          '<div class="max-w-5xl w-full anim-pop">' +
          eyebrowHtml(slide.eyebrow) +
          '<h2 class="text-4xl md:text-5xl font-black mb-7">' + esc(slide.title) + '</h2>' +
          '<div class="glass rounded-2xl overflow-hidden">' +
          '<table class="w-full text-left">' +
          '<thead><tr class="bg-white/10">' +
          (slide.table.head || [])
            .map(function (h) {
              return '<th class="px-5 py-3 text-amarillo font-bold text-base md:text-lg">' + esc(h) + '</th>';
            })
            .join('') +
          '</tr></thead><tbody>' +
          (slide.table.rows || [])
            .map(function (row) {
              return (
                '<tr class="border-t border-white/10">' +
                row
                  .map(function (cell) {
                    return '<td class="px-5 py-3 text-white/80 text-base md:text-lg">' + esc(cell) + '</td>';
                  })
                  .join('') +
                '</tr>'
              );
            })
            .join('') +
          '</tbody></table></div>' +
          footerHtml(slide.footer) +
          '</div>'
        );

      default:
        return (
          '<div class="max-w-4xl anim-pop">' +
          eyebrowHtml(slide.eyebrow) +
          '<h2 class="text-4xl md:text-6xl font-black leading-tight">' + esc(slide.title) + '</h2>' +
          bodyHtml(slide.body) +
          footerHtml(slide.footer) +
          '</div>'
        );
    }
  }

  function render() {
    document.getElementById('stage').innerHTML = renderSlide(slides[index]);
    document.getElementById('counter').textContent = index + 1 + ' / ' + slides.length;
    document.getElementById('progress').style.width = ((index + 1) / slides.length) * 100 + '%';
    document.getElementById('dots').innerHTML = slides
      .map(function (_, i) {
        return (
          '<button data-i="' + i + '" class="dot w-2.5 h-2.5 rounded-full transition ' +
          (i === index ? 'bg-amarillo scale-125' : 'bg-white/25 hover:bg-white/50') +
          '"></button>'
        );
      })
      .join('');
    Array.prototype.forEach.call(document.querySelectorAll('.dot'), function (dot) {
      dot.addEventListener('click', function () {
        go(Number(dot.getAttribute('data-i')));
      });
    });
    if (window.location.hash !== '#' + (index + 1)) {
      history.replaceState(null, '', '#' + (index + 1));
    }
  }

  function go(next) {
    index = Math.max(0, Math.min(next, slides.length - 1));
    render();
  }

  document.getElementById('prev').addEventListener('click', function () { go(index - 1); });
  document.getElementById('next').addEventListener('click', function () { go(index + 1); });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') {
      event.preventDefault();
      go(index + 1);
    } else if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
      event.preventDefault();
      go(index - 1);
    } else if (event.key === 'Home') {
      go(0);
    } else if (event.key === 'End') {
      go(slides.length - 1);
    } else if (event.key === 'f') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
  });

  var startX = null;
  document.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; });
  document.addEventListener('touchend', function (e) {
    if (startX === null) return;
    var delta = e.changedTouches[0].clientX - startX;
    if (Math.abs(delta) > 60) go(index + (delta < 0 ? 1 : -1));
    startX = null;
  });

  var fromHash = Number((window.location.hash || '').replace('#', ''));
  if (fromHash >= 1 && fromHash <= slides.length) index = fromHash - 1;
  render();
</script>
